database: data/harvester.sqlite

storage:
  root: data/pdfs
  temp: data/partials
  layout: content_addressed

search:
  provider: yahoo
  pages_per_query: 10
  delay_seconds: 2.0
  results_per_page: 10

crawler:
  max_depth: 5
  max_pages_per_domain: 10000
  max_pdf_count_per_domain: 100000
  delay_seconds: 0.5

download:
  workers: 16
  timeout: 60
  retries: 5
  chunk_size: 1048576
  delay: 0.25

rate_limit:
  requests_per_second: 2
  concurrent_per_domain: 2

network:
  rotate_headers: true
  rotate_proxies: true
  proxy: null
  proxy_lists:
    - "https://raw.githubusercontent.com/TheSpeedX/SOCKS-List/master/socks5.txt"
    - "https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt"
  user_agent: "GovernmentPDFHarvester/1.0 (+https://github.com/jedisecX/Jedi-Gov-Harvester)"
  user_agents:
    - "GovernmentPDFHarvester/1.0 (+https://github.com/jedisecX/Jedi-Gov-Harvester)"
    - "GovernmentPDFHarvester/1.0 (research; +https://github.com/jedisecX/Jedi-Gov-Harvester)"
    - "Mozilla/5.0 (compatible; GovernmentPDFHarvester/1.0; +https://github.com/jedisecX/Jedi-Gov-Harvester)"
  timeout: 30

allowed_domains:
  - "*.gov"
  - "*.state.*.us"
  - "*.us.gov"

denied_domains:
  - "*.facebook.com"
  - "*.twitter.com"
  - "*.x.com"
  - "*.youtube.com"
  - "*.instagram.com"
  - "*.linkedin.com"
  - "*.tiktok.com"
  - "*.doubleclick.net"
  - "*.google-analytics.com"

seeds:
  path: seeds/agencies.json
